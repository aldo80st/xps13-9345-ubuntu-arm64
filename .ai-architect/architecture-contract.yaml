schema_version: "1.0.0"
revision: 5
scope: xps-authz-v1-1-y-asignacion-presupuestaria-v0-3
architecture_style: controlador-local-determinista-con-frontera-de-privilegios
quality_attributes:
  - name: privilege-isolation
    priority: 1
    rationale: El agente no obtiene administración fuera de operaciones fijas.
    measurable_signal: Pruebas negativas de grupos, sockets, permisos, credenciales y MCP heredados.
  - name: bounded-authorization
    priority: 1
    rationale: Autoridad temporal y consumo explícitos.
    measurable_signal: 1200 segundos por boot; cinco audit, un iris-r0 y un thermal.
  - name: recoverability
    priority: 1
    rationale: Recuperación oficial independiente del cliente.
    measurable_signal: Restauración comprobada tras fallo o desconexión; marcador pendiente bloquea nuevas pruebas.
  - name: auditability
    priority: 2
    rationale: Evidencia protegida y verificable.
    measurable_signal: Registro de grant, revoke, consumo, artefacto, resultado y recuperación sin secretos.
  - name: budget-integrity
    priority: 1
    rationale: No exceder cuotas conocidas ni autorizar gasto adicional.
    measurable_signal: Reservas concurrentes sin doble conteo y cero despachos facturables no autorizados.
  - name: allocation-reproducibility
    priority: 2
    rationale: Decisiones explicables y comparables por clase de tarea.
    measurable_signal: Replay determinista de entradas, versión de política, asignación y motivo.
components:
  - id: owner-control
    responsibility: Conceder y revocar mediante autenticación administrativa local.
    owns_data: []
    public_interfaces: [grant, revoke]
  - id: agent-adapter
    responsibility: Recibir solicitudes fijas con identidad de servicio no administrativa.
    owns_data: []
    public_interfaces: [status, request-action]
  - id: policy-engine
    responsibility: Validar host, boot, identidad, vigencia, alcance y consumir usos atómicamente.
    owns_data: [estado de autorización protegido por root]
    public_interfaces: [grant-policy, revoke-policy, admit-action, read-status]
  - id: action-executor
    responsibility: Ejecutar auditoría de lectura, R0 oficial o térmica acotada mediante unidades diferenciadas.
    owns_data: []
    public_interfaces: [run-fixed-action]
  - id: recovery-manager
    responsibility: Restaurar exclusivamente Iris oficial tras un R0 admitido.
    owns_data: [marcador de recuperación protegido por root]
    public_interfaces: [restore-stock]
  - id: audit-ledger
    responsibility: Registrar evidencias y exponer estados sanitizados.
    owns_data: [recibos protegidos por root]
    public_interfaces: [append-receipt, read-sanitized-status]
  - id: resource-inventory
    responsibility: Normalizar modelos, modalidad, herramientas, privacidad, salud y límites por cuenta y ventana.
    owns_data: [observaciones de cuota y capacidades con procedencia y caducidad]
    public_interfaces: [read-resource-snapshot]
  - id: allocation-policy
    responsibility: Filtrar y recomendar asignación global por dependencia, riesgo, calidad, esfuerzo y presupuesto.
    owns_data: [reglas versionadas de asignación aprobadas por propietario]
    public_interfaces: [recommend-allocation]
  - id: budget-ledger
    responsibility: Registrar reservas, consumos, incertidumbre y conciliación atómica de todos los límites aplicables.
    owns_data: [reservas por paquete y ventanas compartidas]
    public_interfaces: [read-budget, reserve-capacity, reconcile-capacity]
  - id: paseo-adapter
    responsibility: Traducir decisiones autorizadas a Paseo y reconciliar identidad y estado del despacho sin duplicados.
    owns_data: [correlación entre paquete, intento, agente y checkpoint]
    public_interfaces: [observe-dispatch, reconcile-dispatch, submit-approved-package]
  - id: performance-history
    responsibility: Registrar aceptación independiente, tiempo, consumo observado y retrabajo por modelo y clase.
    owns_data: [métricas de resultados y evidencia de evaluación]
    public_interfaces: [read-performance, record-outcome]
external_boundaries:
  - id: local-admin
    responsibility: Propietario autenticado, administración local y recuperación.
  - id: mcp-client
    responsibility: ChatGPT y Paseo sin autoridad administrativa propia.
  - id: os-kernel
    responsibility: Linux, systemd, sensores, módulos oficiales y fuentes de auditoría.
  - id: paseo-runtime
    responsibility: Infraestructura existente de agentes en LUCIFER01, sin gateway adicional.
  - id: model-provider
    responsibility: Modalidades de acceso y cuotas externas observables, no autoridad sobre política local.
dependency_rules:
  - {source: local-admin, target: owner-control, policy: allow-via-interface, via_interface: grant, rationale: Autoridad del propietario.}
  - {source: local-admin, target: owner-control, policy: allow-via-interface, via_interface: revoke, rationale: Revocación independiente.}
  - {source: mcp-client, target: agent-adapter, policy: allow-via-interface, via_interface: request-action, rationale: Solicitudes fijas.}
  - {source: mcp-client, target: agent-adapter, policy: allow-via-interface, via_interface: status, rationale: Estado sanitizado.}
  - {source: owner-control, target: policy-engine, policy: allow-via-interface, via_interface: grant-policy, rationale: Autenticación local.}
  - {source: owner-control, target: policy-engine, policy: allow-via-interface, via_interface: revoke-policy, rationale: Revocar nuevas operaciones y carga térmica.}
  - {source: agent-adapter, target: policy-engine, policy: allow-via-interface, via_interface: admit-action, rationale: Consumo antes de efectos.}
  - {source: agent-adapter, target: policy-engine, policy: allow-via-interface, via_interface: read-status, rationale: Estado sin modificación.}
  - {source: agent-adapter, target: owner-control, policy: deny, rationale: No concederse permisos.}
  - {source: agent-adapter, target: action-executor, policy: deny, rationale: No saltar admisión.}
  - {source: agent-adapter, target: recovery-manager, policy: deny, rationale: No invocar recuperación arbitraria.}
  - {source: policy-engine, target: action-executor, policy: allow-via-interface, via_interface: run-fixed-action, rationale: Operación admitida.}
  - {source: action-executor, target: recovery-manager, policy: allow-via-interface, via_interface: restore-stock, rationale: Restauración obligatoria de R0.}
  - {source: action-executor, target: os-kernel, policy: allow, rationale: Acceso según permisos de cada operación.}
  - {source: recovery-manager, target: os-kernel, policy: allow, rationale: Solo módulo oficial fijado.}
  - {source: action-executor, target: audit-ledger, policy: allow-via-interface, via_interface: append-receipt, rationale: Evidencia de operación.}
  - {source: recovery-manager, target: audit-ledger, policy: allow-via-interface, via_interface: append-receipt, rationale: Evidencia de recuperación.}
  - {source: policy-engine, target: audit-ledger, policy: allow-via-interface, via_interface: append-receipt, rationale: Evidencia de política.}
  - {source: agent-adapter, target: audit-ledger, policy: allow-via-interface, via_interface: read-sanitized-status, rationale: Sin escritura agente.}
  - {source: allocation-policy, target: resource-inventory, policy: allow-via-interface, via_interface: read-resource-snapshot, rationale: Datos con procedencia.}
  - {source: allocation-policy, target: budget-ledger, policy: allow-via-interface, via_interface: read-budget, rationale: Selección con restricciones.}
  - {source: allocation-policy, target: performance-history, policy: allow-via-interface, via_interface: read-performance, rationale: Evidencia histórica.}
  - {source: allocation-policy, target: paseo-runtime, policy: deny, rationale: Modo sombra sin despacho directo.}
  - {source: allocation-policy, target: owner-control, policy: deny, rationale: Presupuesto no concede autoridad hardware.}
  - {source: paseo-adapter, target: budget-ledger, policy: allow-via-interface, via_interface: reserve-capacity, rationale: Reserva previa a despacho autorizado futuro.}
  - {source: paseo-adapter, target: budget-ledger, policy: allow-via-interface, via_interface: reconcile-capacity, rationale: Consumo e incertidumbre.}
  - {source: paseo-adapter, target: paseo-runtime, policy: allow, rationale: Observar y reconciliar en sombra; despacho solo después de gate.}
  - {source: resource-inventory, target: model-provider, policy: allow, rationale: Metadatos permitidos por modalidad.}
  - {source: paseo-adapter, target: owner-control, policy: deny, rationale: No elevar permisos.}
  - {source: paseo-adapter, target: action-executor, policy: deny, rationale: No eludir AUTHZ.}
required_practices:
  - Identidad dedicada sin grupos administrativos ni credenciales, sockets o sesiones heredadas; retirar rutas agente antiguas tras validar migración y rollback.
  - Grant local autenticado, 1200 segundos CLOCK_BOOTTIME y boot ID; cinco audit, un iris-r0 y un thermal; consumo atómico antes de efectos, sin renovar o recuperar usos por fallo.
  - Código, configuración, estado y recibos protegidos por root; argumentos y unidades exactos, entorno limpio, sin scripts de home privilegiados.
  - Auditoría con lectura de módulos, sin CAP_SYS_MODULE ni syscalls de carga o descarga; no usar aislamiento que oculte los archivos requeridos.
  - R0 fijado a kernel y hash oficial; energía, identidad y ausencia de usuarios comprobadas; sin fuerza; recuperación oficial independiente y acotada.
  - Térmica sin privilegios; un trabajador 10 segundos, cerca de 25 por ciento de un núcleo; inicio menor a 55 C, abortar a 65 C o batería a 40 C, alimentación externa y batería al menos 30 por ciento; sensor inválido implica denegación.
  - Revocar nuevas acciones y detener térmica; no impedir la restauración de R0 ya admitido. Bloquear operaciones incompatibles si recuperación pendiente.
  - Validar nativamente identidad, permisos, unidades, recuperación y pruebas negativas antes de activar; guardar recibos y hashes.
  - M3 debe probar ambas rutas MCP desde la perspectiva del agente, incluyendo negativa de sudo genérico, Docker/LXD, bus y sesión de propietario, archivos, sockets, credenciales, conectores heredados y permisos de gestión de servicios. Rollback preserva consola local y no devuelve autoridad administrativa a agentes. Si una ruta no puede aislarse, ninguna operación privilegiada se habilita.
  - Admisión consume un uso y deja recibo durable antes de efectos; si escritura o sincronización falla, denegar. Estado, consumo y marcador sobreviven caída de proceso. Escritura atómica y fsync de archivo/directorio o transacción durable equivalente; no reintentar automáticamente efectos. Reinicio del controlador no devuelve usos; boot distinto invalida lease.
  - "Definir punto de compromiso bajo bloqueo común con revocación y expiración: revalidar lease y reserva de tiempo antes de iniciar efecto, persistir compromiso y marcador de R0 antes de descargar. Revocación no se anuncia completada hasta impedir nuevos compromisos; si R0 ya comprometido, solo finalizar restauración oficial. No iniciar nueva descarga tras caducidad o revocación."
  - Caducidad o revocación durante térmica termina trabajador sin privilegios. Muestreo de temperatura y lease cada 250 ms objetivo; parada comprobada en hasta 2 s bajo condiciones responsivas, watchdog independiente y máximo 12 s de vida del trabajador aun si cae el controlador. Si falta telemetría, abortar; no afirmar garantía de tiempo real.
  - "R0 recuperación independiente de cliente y proceso principal: guardar marcador durable con boot, autorización y artefacto oficial antes de descargar; restaurar sin forzar, con presupuesto explícito y supervisor, incluso tras revocar/caducar."
  - "Mantener bloqueo hasta identidad de módulo oficial, dispositivos y smoke 120 cuadros CPU/Iris. Si restauración o smoke falla conservar marcador; si boot cambia, bloquear y pedir reconciliación local sin carga automática. Fallo de registro no cancela recuperación ya comprometida."
  - Recibos de admisión, resultado y recuperación correlacionados por ID; error de registro bloquea nuevas acciones, incluso auditoría. Persistir evidencia de fallo cuando posible; no declarar PASS sin recibo durable y verificación. Ensayar disco lleno, proceso caído, carrera, pérdida de cliente y manipulación desde ambas identidades.
  - "ADR-002. Cero MXN adicionales por defecto. Identificar modalidad de autenticación y facturación; denegar cualquier consumo monetario adicional posible no autorizado. Preferir herramientas deterministas suficientes y, entre modelos de calidad comparable, modalidades gratuitas aptas en privacidad y presupuesto; no fijar roles por proveedor."
  - "Inventariar límites por cuenta, familia, modelo y ventana con unidad, saldo o intervalo, origen, fecha, caducidad y renovación. Tokens de entrada, salida, caché y razonamiento cuando observables, separados de cuotas de mensajes, tiempo u otras unidades. No convertirlas sin evidencia ni sumar saldos compartidos."
  - "Reservas iniciales sobre capacidad utilizable por límite conocido: OpenAI y Anthropic 65/25/10 por ejecución/revisión/contingencia; gratuitas 85/10/5. Parámetros provisionales, no saldos medidos. Repartir trabajo útil antes de renovación sin sacrificar revisión ni seguridad. Considerar todos los límites simultáneos y consumo ajeno al piloto."
  - "Admisibilidad previa a ranking: alcance, privacidad por modalidad, herramientas, permisos, salud, cuota, plazo, dependencias y capacidad de revisión. Saldo desconocido no es infinito ni cero. El selector solo simula u observa pilotos; en P7 debe denegar despacho automatizado si algún límite aplicable es UNKNOWN o no está verificada facturación cero/privacidad. La coordinación manual anterior a P7 no recibe autoridad nueva."
  - "Seleccionar modelo y esfuerzo mínimo suficiente por categoría; optimizar conjunto de paquetes, camino crítico, capacidad de revisión y coste de oportunidad de cuota. Versionar entradas y reglas, justificar desempate estable, reproducir recomendación; no inventar puntuaciones por datos faltantes."
  - "Reservar todos los límites aplicables atómicamente antes de un futuro despacho autorizado. Identificador estable por paquete e intento; estados propuesto/reservado/despacho incierto/confirmado/terminal. Reconciliar con Paseo antes de repetir o liberar reserva ante respuesta ausente; no duplicar escritores ni trabajo. Transferir checkpoint al reasignar."
  - "Registrar por modelo, versión, modalidad, clase y esfuerzo: resultado aceptado, primera revisión, retrabajo, defectos detectados/escapados, duración y consumo observado o desconocido. Separar fallos del entorno de desempeño. Revisar calibración con muestra suficiente y aprobación del propietario; no autoeditar política."
  - "Modo sombra inicial sin iniciar, cancelar ni reasignar agentes, sin reservar cuota externa ni modificar privilegios. Comparar recomendaciones con decisiones existentes, pruebas simuladas y replay. Activación operativa solo tras aceptación y transición explícita de AGENTS.md; revisor distinto del implementador en cambios críticos."
  - "Prioridad de calidad por clase de tarea: entre candidatos admisibles, elegir el modelo, versión, arnés y esfuerzo con mejor evidencia de aceptación y fiabilidad para el riesgo y complejidad del paquete. Establecer umbral de calidad y tratar diferencias dentro de incertidumbre como equivalentes; entre equivalentes optimizar cuota, tiempo y retrabajo. No degradar calidad material solo por gratuidad, ni romper presupuesto cero o gates por calidad."
  - "Mantener catálogo dinámico de evidencia externa por benchmark, versión, fecha, conjunto de tareas, modelo, esfuerzo, arnés, métricas e incertidumbre. Comparar únicamente resultados compatibles; usar evaluaciones externas como referencia inicial y pruebas locales comparables como evidencia específica. Actualizar cuando cambie modelo, arnés o benchmark; no congelar ranking universal ni asignar resultados a otra variante."
  - "Ante despacho incierto, persistir estado y retener la reserva y exclusión del paquete hasta evidencia positiva correlacionada de no inicio o terminal con consumo reconciliado. Timeout, ausencia de ID, vencimiento o renovación de ventana no son evidencia de no inicio; mantener cuarentena y descontar capacidad comprometida aplicable incluso si cambian ventanas. Si no se puede cuantificar tras renovación o uso externo, bloquear nueva admisión de límites afectados."
  - "En sombra P0-P6 rige AGENTS.md sin cambios; el selector no despacha. Para P7 exigir revisión y aprobación explícitas de transición. Antes de admitir cambio crítico, reservar capacidad de revisión independiente y verificar identidades de agente distintas, sin autorrevisión ni escritor concurrente. Si no hay revisor admisible, diferir. Registrar identidad/modelo y evidencia del gate; preferir diversidad de proveedor cuando sea viable."
prohibited_practices:
  - Shell root, argumentos o rutas arbitrarias, comodines, renovación por agente o credenciales administrativas compartidas.
  - Arranque, GRUB, EFI, firmware, Secure Boot, BitLocker, particiones, reinicio, módulos experimentales y ajustes térmicos persistentes.
  - Eludir controles de conectores o usar identidad administrativa como sustituto del canal restringido.
  - Declarar aislamiento efectivo si un MCP administrativo sigue disponible a los agentes.
  - Instalar o activar sin gates; ejecutar R0 o térmica sin grant local vigente. No habilitar después de registrar un fallo de evidencia o recuperación pendiente.
  - "Facturación por API de pago, compra de créditos, cambio de modalidad con coste o uso de datos incompatible sin aprobación específica. No interpretar suscripción como capacidad ilimitada."
  - "Usar proveedor alternativo para eludir cuotas, sandbox, permisos o gates; reintento ciego de despacho incierto; contar envío como aceptación; publicar credenciales o contenido privado a modalidad no autorizada."
  - "Desplegar un gateway nuevo, habilitar control automático de Paseo desde modo sombra, modificar AUTHZ o otros proyectos por esta decisión."
decision_ids: [ADR-001, ADR-002]
unresolved_questions:
  - id: Q-001
    question: Mecanismos de conexión y credenciales para migrar ambos MCP sin heredar autoridad administrativa.
    decision_impact: Bloquea aceptación M1 y M3.
    critical: true
    answer: null
  - id: Q-002
    question: Aceptación de política, unidades y recuperación sobre kernel nativo.
    decision_impact: Bloquea M4 y M5.
    critical: true
    answer: null
  - id: Q-003
    question: Límites reales, unidades, ventanas compartidas y observabilidad por modalidad de cada familia.
    decision_impact: Bloquea reserva cuantitativa y activación operativa; no bloquea modo sombra con UNKNOWN.
    critical: true
    answer: null
  - id: Q-004
    question: Condiciones de tratamiento de datos y garantía de no facturación de cada modalidad gratuita o local.
    decision_impact: Bloquea envío de contenido no público a modalidad no aprobada.
    critical: true
    answer: null
